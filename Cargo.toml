[package]
name = "pbl-tablebot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12", features = ["client", "gateway", "rustls_backend", "model"] }
poise = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenv = "0.15"
anyhow = "1"
tokio-sync = "0.1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
